<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI灵魂画手 · 你画我猜</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2B2D42; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #2B2D42; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #F4F1E8; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; gap: 18px; }
      #loading h1 { margin: 0; font-size: 56px; color: #FFC83D; letter-spacing: 6px; font-weight: 700; }
      #loading p { margin: 0; color: #A9ABC4; font-size: 18px; }
      #bar { width: min(420px, 70vw); height: 14px; border-radius: 7px; background: #393C5A; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #FFC83D; border-radius: 7px; transition: width .2s; }
      #doodle { width: 120px; height: 80px; }
      #doodle path { fill: none; stroke: #FFC83D; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300;
        animation: draw 1.6s ease-in-out infinite alternate; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <svg id="doodle" viewBox="0 0 120 80"><path d="M10 60 C 30 10, 50 10, 60 40 S 90 70, 110 20"/></svg>
      <h1>AI灵魂画手</h1>
      <p id="tip">画师正在削铅笔……</p>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/a61c5e0d301da454871257fd368fbde6.loader.js"></script>
    <script>
      var tips = ["画师正在削铅笔……", "正在把灵魂注入线条……", "正在说服大象配合摆拍……", "抽象程度加载中……"];
      var tipEl = document.getElementById("tip");
      var tipTimer = setInterval(function () { tipEl.textContent = tips[Math.floor(Math.random() * tips.length)]; }, 1800);
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/d2b80a13e4b6cc21643a53028f59c6a3.data.unityweb",
        frameworkUrl: "Build/18991db8f3180bc5d56768536ec530cf.framework.js.unityweb",
        codeUrl: "Build/766ae1275f5dec54d7878d83ff6f44f3.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "image-to-text",
        productName: "AI灵魂画手",
        productVersion: "0.1.0",
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        clearInterval(tipTimer);
        document.getElementById("loading").remove();
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        tipEl.textContent = "加载失败：" + message;
      });
    </script>
  </body>
</html>
